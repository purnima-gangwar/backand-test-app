<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniToku Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --muted: #6b7280;
      --text: #111827;
      --border: #e5e7eb;
      --shadow: rgba(0, 0, 0, 0.08);
      --danger: #ef4444;
      --radius: 12px;
      --transition: all 0.2s ease;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      font-size: 14px;
    }

    aside {
      width: 260px;
      background: var(--card);
      padding: 24px;
      box-shadow: 2px 0 10px var(--shadow);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    aside h2 {
      margin: 0 0 32px 0;
      font-size: 20px;
      color: var(--accent);
      font-weight: 700;
    }

    aside button {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 12px 16px;
      text-align: left;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 8px;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    aside button:hover {
      background: #eef2ff;
      color: var(--accent);
    }

    aside button.active {
      background: var(--accent);
      color: white;
    }

    main {
      flex: 1;
      padding: 32px;
      overflow: auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .top h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 600;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn.primary {
      background: var(--accent);
      color: white;
    }

    .btn.primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn.ghost {
      background: white;
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .btn.ghost:hover {
      background: #eef2ff;
    }

    .btn.danger {
      background: var(--danger);
      color: white;
    }

    .btn.sm {
      padding: 6px 12px;
      font-size: 13px;
    }

    .card {
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: 0 6px 20px var(--shadow);
      margin-bottom: 24px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:hover {
      background: #f9fafb;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      z-index: 100;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal .modalCard {
      background: var(--card);
      padding: 24px;
      border-radius: var(--radius);
      width: 480px;
      max-width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--text);
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      transition: var(--transition);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .pw-group {
      position: relative;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pw-toggle {
      background: var(--accent);
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .pw-toggle:hover {
      background: var(--accent-hover);
    }

    .modal-footer {
      margin-top: 20px;
      text-align: right;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
    }

    .token-box {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
      border: 1px dashed var(--border);
      margin: 12px 0;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { width: 100%; box-shadow: none; border-bottom: 1px solid var(--border); }
      main { padding: 20px; }
      .top { flex-direction: column; align-items: stretch; gap: 16px; }
    }
  </style>
</head>
<body>

<aside>
  <h2>AniToku Admin</h2>
  <button id="nav-dashboard" class="active" onclick="activate('dashboard')">Dashboard</button>
  <button id="nav-token" onclick="activate('token')">Token</button>
  <button onclick="logout()" style="margin-top: auto; color: var(--danger);">Logout</button>
</aside>

<main>
  <div class="top">
    <h1>Dashboard</h1>
    <button class="btn primary" onclick="openCreateModal()">+ Create User</button>
  </div>

  <section id="dashboard">
    <div class="card">
      <input id="search" class="search-input" placeholder="Search by username or email..." oninput="renderUsers()" />
      <table id="usersTable">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Password</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="token" style="display:none;">
    <div class="card">
      <h3>Admin Token</h3>
      <p class="note">This token is used for API authentication.</p>
      <div class="token-box" id="adminTokenInput">Loading...</div>
      <div style="display:flex;gap:10px;">
        <button class="btn ghost" onclick="copyToken()">Copy</button>
        <button class="btn primary" onclick="refreshToken()">Refresh</button>
      </div>
    </div>
  </section>
</main>

<!-- Create/Edit Modal -->
<div id="modal" class="modal">
  <div class="modalCard">
    <h2 id="modalTitle">Create User</h2>
    <div class="form-group">
      <label>Username</label>
      <input id="mUsername" placeholder="johndoe" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input id="mEmail" type="email" placeholder="john@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="pw-group">
        <input id="mPassword" type="password" placeholder="Leave empty to keep current" />
        <button class="pw-toggle" onclick="togglePw()">Show</button>
        <button class="pw-toggle" onclick="generatePassword()">Generate</button>
      </div>
      <div class="note" id="modalNote"></div>
    </div>
    <div class="modal-footer">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="submitModal()">Save</button>
    </div>
  </div>
</div>

<!-- View Password Modal -->
<div id="pwModal" class="modal">
  <div class="modalCard">
    <h2>View Password</h2>
    <div class="form-group">
      <label>Decrypted Password</label>
      <input id="plainPassword" readonly style="background:#f3f4f6;font-family:monospace;" />
    </div>
    <div class="note">Keep this secret. Do not share.</div>
    <div class="modal-footer">
      <button class="btn primary" onclick="closePwModal()">Close</button>
    </div>
  </div>
</div>

<script>
let adminToken = '';
let users = [];
let editingId = null;

// Cookie
function setCookie(n, v, d) {
  const date = new Date();
  date.setTime(date.getTime() + d * 24 * 60 * 60 * 1000);
  document.cookie = `${n}=${v};path=/;expires=${date.toUTCString()};Secure;SameSite=Strict`;
}

function getCookie(n) {
  const match = document.cookie.match(new RegExp('(^| )' + n + '=([^;]+)'));
  return match ? match[2] : null;
}

// Init
window.addEventListener('load', async () => {
  const token = getCookie('adminToken');
  if (token) {
    adminToken = token;
    document.getElementById('adminTokenInput').textContent = token;
    await loadUsers();
  } else {
    showLoginCard();
  }
});

// Login
async function showLoginCard() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.style.display = 'flex';
  modal.innerHTML = `
    <div class="modalCard">
      <h2>Admin Login</h2>
      <div class="form-group">
        <label>Username</label>
        <input id="lUser" value="admin" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="lPass" type="password" value="admin_anitoku" />
      </div>
      <div id="loginErr" style="color:var(--danger);margin-top:8px;font-size:13px"></div>
      <div class="modal-footer">
        <button class="btn primary" onclick="doAdminLogin(this)">Login</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function doAdminLogin(btn) {
  const u = document.getElementById('lUser').value.trim();
  const p = document.getElementById('lPass').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.message || 'Login failed');
    }

    adminToken = data.adminToken;
    setCookie('adminToken', adminToken, 7);
    document.getElementById('adminTokenInput').textContent = adminToken;
    document.querySelector('.modal').remove();
    await loadUsers();

  } catch (e) {
    err.textContent = e.message;
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}

// Load Users
async function loadUsers() {
  try {
    const res = await fetch('/admin/users');

    if (res.status === 401 || res.status === 403) {
      alert('Session expired. Please login again.');
      logout();
      return;
    }

    if (!res.ok) throw new Error('Failed to load users');

    const j = await res.json();
    users = j.users || [];
    renderUsers();
  } catch (e) {
    console.error(e);
    alert('Error: ' + e.message);
  }
}

// Render
function renderUsers() {
  const term = (document.getElementById('search').value || '').toLowerCase();
  const tbody = document.querySelector('#usersTable tbody');
  tbody.innerHTML = '';
  users
    .filter(u => u.username.toLowerCase().includes(term) || u.email.toLowerCase().includes(term))
    .forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${u.username}</b></td>
        <td>${u.email}</td>
        <td><button class="btn ghost sm" onclick="viewPassword('${u.id}')">View</button></td>
        <td class="actions">
          <button class="btn ghost sm" onclick="openEdit('${u.id}')">Edit</button>
          <button class="btn danger sm" onclick="deleteUser('${u.id}')">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
}

// Modal
function openCreateModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Create User';
  document.getElementById('mUsername').value = '';
  document.getElementById('mEmail').value = '';
  document.getElementById('mPassword').value = '';
  document.getElementById('mPassword').type = 'password';
  document.getElementById('modalNote').textContent = '';
  document.getElementById('modal').style.display = 'flex';
}

function openEdit(id) {
  const u = users.find(x => x.id === id);
  if (!u) return alert('User not found');
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit User';
  document.getElementById('mUsername').value = u.username;
  document.getElementById('mEmail').value = u.email;
  document.getElementById('mPassword').value = '';
  document.getElementById('modalNote').textContent = 'Leave password empty to keep current.';
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

async function submitModal() {
  const username = document.getElementById('mUsername').value.trim();
  const email = document.getElementById('mEmail').value.trim();
  const password = document.getElementById('mPassword').value;

  if (!username || !email || (!editingId && !password)) {
    return alert('Please fill all required fields');
  }

  try {
    const url = editingId ? `/admin/users/${editingId}` : '/admin/users';
    const method = editingId ? 'PUT' : 'POST';
    const body = { username, email };
    if (password) body.password = password;

    const res = await fetch(url, {
      method,
      headers: {
        'Content-Type': 'application/json',

      },
      body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error((await res.json()).message || 'Failed');
    closeModal();
    await loadUsers();
  } catch (e) {
    alert(e.message);
  }
}

async function deleteUser(id) {
  if (!confirm('Delete this user permanently?')) return;
  try {
    const res = await fetch(`/admin/users/${id}`, {
      method: 'DELETE',
      
    });
    if (!res.ok) throw new Error('Delete failed');
    await loadUsers();
  } catch (e) {
    alert(e.message);
  }
}

async function viewPassword(id) {
  try {
    const res = await fetch(`/admin/users/${id}/password`, {
      
    });
    if (!res.ok) throw new Error((await res.json()).message || 'Failed');
    const j = await res.json();
    document.getElementById('plainPassword').value = j.password || '(empty)';
    document.getElementById('pwModal').style.display = 'flex';
  } catch (e) {
    alert(e.message);
  }
}

function closePwModal() { document.getElementById('pwModal').style.display = 'none'; }

function generatePassword() {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
  let pw = '';
  for (let i = 0; i < 12; i++) {
    pw += chars[Math.floor(Math.random() * chars.length)];
  }
  document.getElementById('mPassword').value = pw;
}

function togglePw() {
  const input = document.getElementById('mPassword');
  const btn = input.nextElementSibling;
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Hide';
  } else {
    input.type = 'password';
    btn.textContent = 'Show';
  }
}

function copyToken() {
  const text = document.getElementById('adminTokenInput').textContent;
  navigator.clipboard.writeText(text).then(() => alert('Token copied!'));
}

async function refreshToken() {
  const u = prompt('Admin username', 'admin');
  const p = prompt('Admin password', 'admin_anitoku');
  if (!u || !p) return;
  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    if (!res.ok) throw new Error('Refresh failed');
    const j = await res.json();
    adminToken = j.adminToken;
    setCookie('adminToken', adminToken, 7);
    document.getElementById('adminTokenInput').textContent = adminToken;
    alert('Token refreshed');
  } catch (e) {
    alert(e.message);
  }
}

function logout() {
  setCookie('adminToken', '', -1);
  adminToken = '';
  location.reload();
}

function activate(section) {
  document.getElementById('dashboard').style.display = section === 'dashboard' ? 'block' : 'none';
  document.getElementById('token').style.display = section === 'token' ? 'block' : 'none';
  document.querySelectorAll('aside button').forEach(b => b.classList.remove('active'));
  if (section === 'dashboard') document.getElementById('nav-dashboard').classList.add('active');
  if (section === 'token') document.getElementById('nav-token').classList.add('active');
}
</script>
</body>
</html>
